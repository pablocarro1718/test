name: Sync Portfolio Data

on:
  schedule:
    # 4 veces al día en días laborables: 7h, 11h, 15h, 19h UTC (8h, 12h, 16h, 20h España)
    - cron: '0 7,11,15,19 * * 1-5'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

permissions:
  contents: write  # Permite hacer push al repositorio

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests python-dotenv yfinance

      - name: Sync IBKR
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
        run: python ibkr_sync.py

      - name: Sync Kraken
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_PRIVATE_KEY: ${{ secrets.KRAKEN_PRIVATE_KEY }}
        run: python kraken_sync.py

      - name: Normalize all transactions
        run: python normalizar_inversiones.py

      - name: Migrate to SQLite
        run: python migrate_to_sqlite.py

      - name: Sync to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python sync_to_turso.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync: Update portfolio data $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
